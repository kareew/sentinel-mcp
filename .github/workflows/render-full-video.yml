name: Render full video

on:
  push:
    branches: [claude/office-corridor-seedance-g14esp]
    paths: ['.github/workflows/render-full-video.yml']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download clips
        run: |
          set -euo pipefail
          mkdir -p work
          urls=(
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062155_6bd0584e-7214-4ce7-a4be-8e1ec59384c5.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062159_5bfc4d7e-5c4f-4853-8d0e-1e6fb6e02dc4.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062205_247b4c87-ef76-4f96-9207-2d4517dfd987.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062215_1c8ef9e4-ceb4-4349-899a-e13ffe7435de.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062221_098d2d64-1fe2-43cd-917e-f95580a03b1b.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062243_3908ce6a-2001-409b-908c-7d6e3b64b058.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062511_7816f71e-87ef-4056-9486-df2d8ec2bacc.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062515_1ff17dc1-9ad5-40b9-a419-e93cafba45f1.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062522_b0d9c331-054b-46a9-87fe-6d24159edef2.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062526_a8167ebe-b061-496c-b9d6-226dfdb682d3.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062532_2e7e2504-4844-494f-98e5-c41816f4cfb9.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062739_bd33c4a2-35fb-4c06-b869-07263661aaca.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062744_f0e72409-4dca-40f4-be8a-4d33a4267d75.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062747_29d534a9-16b0-4a6c-841c-e9cb42d48fc7.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062754_e332b511-1836-45df-9baf-8d19af2ef6e1.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062803_8b1381d1-8b25-402f-b090-7442e1109e41.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_062808_56b8b51e-c385-408e-afa0-72e88cffd172.mp4"
            "https://d8j0ntlcm91z4.cloudfront.net/user_2wk7uXGMIaZ3MOPyoah76vZPwNx/hf_20260702_063014_429dcb63-2d59-4aef-9c3c-66f782a730a0.mp4"
          )
          n=0
          for u in "${urls[@]}"; do
            n=$((n+1))
            curl -fsSL --retry 3 -o "work/raw_$n.mp4" "$u"
          done

      - name: Normalize and concat
        run: |
          set -euo pipefail
          cd work
          for i in $(seq 1 18); do
            if ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "raw_$i.mp4" | grep -q audio; then
              ffmpeg -y -i "raw_$i.mp4" \
                -vf "scale=854:480,fps=24,setsar=1" \
                -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p \
                -c:a aac -ar 44100 -ac 2 "norm_$i.mp4"
            else
              ffmpeg -y -i "raw_$i.mp4" -f lavfi -i anullsrc=r=44100:cl=stereo \
                -map 0:v -map 1:a -shortest \
                -vf "scale=854:480,fps=24,setsar=1" \
                -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p \
                -c:a aac -ar 44100 -ac 2 "norm_$i.mp4"
            fi
          done
          # closing black tail
          ffmpeg -y -f lavfi -i color=black:s=854x480:r=24 -f lavfi -i anullsrc=r=44100:cl=stereo \
            -t 1 -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p \
            -c:a aac -ar 44100 -ac 2 norm_19.mp4
          for i in $(seq 1 19); do echo "file 'norm_$i.mp4'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../yolk_air_full.mp4

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yolk_air_full.mp4
          git commit -m "Add rendered full video"
          git push
